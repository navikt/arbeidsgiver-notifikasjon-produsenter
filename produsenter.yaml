# Skjema:
# <<tjeneste-id>>:
#   teamNavn: <<navn på team>>
#   slack: <<kanal hvor vi kan nå dere>>
#   accessPolicy:
#     - <<cluster>>:<<namespace>>:<<app>>
#   merkelapper:
#     - <<merkelapp 1>>
#     - <<merkelapp 2>>
#     - <<..>>
#   mottakere:
#     - ressursId: nav_<domene>_<tjeneste>   # Altinn 3
#     - nærmesteLeder
#
# Eksempel:
#
# innsyn-i-aareg:
#   accessPolicy:
#     - dev-gcp:fager:innsyn-i-aareg-api
#     - prod-gcp:fager:innsyn-i-aareg-api
#   merkelapper:
#     - arbeidsforhold
#   mottakere:
#     - ressursId: nav_aareg_innsyn
#     - nærmesteLeder

